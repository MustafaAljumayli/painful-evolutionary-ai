# Loop configuration: which model each role runs on, and how hard it thinks.
# This is the one place to change it.
#
#   scripts/agent.sh     starts the lead and every stage agent with these
#   scripts/loop.py      routes each loop and applies the limits below
#   scripts/qa_model.sh  picks QA's model for a branch from these
#   scripts/check.sh     fails if .claude/agents/*.md disagrees with these,
#                        or if a feature branch touches a protected path
#
# Models: sonnet | opus | haiku.  Effort: low | medium | high | xhigh | max.

# The lead only relays: it starts the agents the loop driver names and
# reports at the end. The planner only splits a feature into subtasks.
LEAD_MODEL=sonnet
LEAD_EFFORT=low
PLANNER_MODEL=sonnet
PLANNER_EFFORT=low

# The researcher decides what is true. Its mistakes reach every later step.
RESEARCHER_MODEL=opus
RESEARCHER_EFFORT=high

# Executors design and build one subtask each.
EXECUTOR_MODEL=sonnet
EXECUTOR_EFFORT=medium

# QA runs on the stronger model when a branch changes a file whose
# correctness decides an experimental result, or a test that guards one.
# Everything else is plumbing. Entries are path prefixes.
QA_EFFORT=high
QA_MODEL_CRITICAL=opus
QA_MODEL_PLUMBING=sonnet

# The reviewer judges the finished pull request, on the same two models.
REVIEWER_EFFORT=high
CRITICAL_PATHS="src/write.py src/analyze.py src/models.py src/run_choice.py prereg/ tests/test_write tests/test_analyze tests/test_models tests/test_prereg"

# Limits the loop driver applies.
PLAN_MAX_LINES=60
MAX_SUBTASK_FAILS=3
MAX_QA_ROUNDS=6
# Review rounds before reviewer and executor must take it to the user.
MAX_REVIEW_ROUNDS=3
# How long `loop.sh wait` blocks before it returns to be run again. Keep it
# under the shell-command time limit of the agent that runs the lead.
WAIT_SECONDS=240

# Paths no feature branch may change. A change here is made by a person, on
# main. scripts/check.sh fails on any other branch that touches one.
PROTECTED_PATHS="environment.yml pyproject.toml loop.conf .gitignore .graphifyignore .gitmodules CLAUDE.md AGENTS.md README.md scripts/ docs/ .claude/ .github/ third_party/"
