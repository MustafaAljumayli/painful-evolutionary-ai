# Loop configuration: which model each role runs on, and how hard it thinks.
# This is the one place to change it.
#
#   scripts/agent.sh     starts the lead, a loop and an executor with these
#   scripts/qa_model.sh  picks QA's model for a branch from these
#   scripts/check.sh     fails if .claude/agents/*.md disagrees with these
#
# Models: sonnet | opus | haiku.  Effort: low | medium | high | xhigh | max.

# The lead and the loop only route work: start agents, read reports, decide
# what happens next. The planner only splits a feature into subtasks.
LEAD_MODEL=sonnet
LEAD_EFFORT=low
LOOP_MODEL=sonnet
LOOP_EFFORT=low
PLANNER_MODEL=sonnet
PLANNER_EFFORT=low

# The researcher decides what is true. Its mistakes reach every later step.
RESEARCHER_MODEL=opus
RESEARCHER_EFFORT=high

# Executors design and build one subtask each.
EXECUTOR_MODEL=sonnet
EXECUTOR_EFFORT=medium

# QA runs on the stronger model when a branch changes a file whose
# correctness decides an experimental result, or a test that guards one.
# Everything else is plumbing. Entries are path prefixes.
QA_EFFORT=high
QA_MODEL_CRITICAL=opus
QA_MODEL_PLUMBING=sonnet
CRITICAL_PATHS="src/write.py src/analyze.py src/models.py src/run_choice.py prereg/ tests/test_write tests/test_analyze tests/test_models tests/test_prereg"
